
name: vlans-routing-vpn-firewalls-proxy

services:
  web1:
    image: nginx:alpine
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - frontend

  web2:
    image: nginx:alpine
    ports:
      - "8081:80"
    restart: unless-stopped
    networks:
      - frontend

networks:
  frontend:
    driver: bridge



